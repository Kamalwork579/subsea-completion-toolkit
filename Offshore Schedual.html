<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotation Work Schedule 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --text: #e8eaf6;
    --muted: #6b7280;
    --accent: #4f6ef7;

    --travel-out: #f5c842;
    --travel-out-bg: rgba(245,200,66,0.15);
    --work: #4ade80;
    --work-bg: rgba(74,222,128,0.12);
    --travel-home: #f43f5e;
    --travel-home-bg: rgba(244,63,94,0.15);
    --off: transparent;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 38px; height: 38px;
    background: var(--accent);
    border-radius: 10px;
    display: grid; place-items: center;
    font-size: 18px;
  }
  h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.3px; }
  h1 span { color: var(--accent); }
  .year-nav {
    display: flex; align-items: center; gap: 10px;
  }
  .year-nav button {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); width: 32px; height: 32px; border-radius: 8px;
    cursor: pointer; font-size: 16px; display: grid; place-items: center;
    transition: background .15s;
  }
  .year-nav button:hover { background: var(--accent); }
  .year-label { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1rem; min-width: 50px; text-align: center; }

  /* ── LEGEND ── */
  .legend {
    display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 24px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 18px;
  }
  .leg { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 500; }
  .leg-dot { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
  .leg-yellow { background: var(--travel-out); }
  .leg-green  { background: var(--work); }
  .leg-red    { background: var(--travel-home); }
  .leg-white  { background: var(--surface2); border: 1px solid var(--border); }

  /* ── STATS BAR ── */
  .stats {
    display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 28px;
  }
  .stat-card {
    flex: 1; min-width: 140px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 18px;
  }
  .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 600; }
  .stat-value.green  { color: var(--work); }
  .stat-value.yellow { color: var(--travel-out); }
  .stat-value.red    { color: var(--travel-home); }
  .stat-value.blue   { color: var(--accent); }

  /* ── YEAR GRID ── */
  .year-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }

  /* ── MONTH CARD ── */
  .month-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .month-header {
    background: var(--surface2);
    padding: 12px 16px;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.3px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .month-summary {
    display: flex; gap: 10px;
  }
  .ms-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem; font-weight: 600;
    padding: 2px 8px; border-radius: 20px;
  }
  .ms-green  { background: var(--work-bg); color: var(--work); }
  .ms-yellow { background: var(--travel-out-bg); color: var(--travel-out); }
  .ms-red    { background: var(--travel-home-bg); color: var(--travel-home); }

  .month-body { padding: 12px; }

  .dow-row {
    display: grid; grid-template-columns: repeat(7,1fr);
    margin-bottom: 6px;
  }
  .dow-cell {
    text-align: center;
    font-size: 0.68rem; font-weight: 600;
    color: var(--muted);
    padding: 4px 2px;
    text-transform: uppercase;
  }
  .dow-cell.sat, .dow-cell.sun { color: #5b6380; }

  .days-grid {
    display: grid; grid-template-columns: repeat(7,1fr); gap: 3px;
  }
  .day-cell {
    aspect-ratio: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 7px;
    font-size: 0.78rem; font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: transform .1s, box-shadow .1s;
    border: 1.5px solid transparent;
  }
  .day-cell:hover { transform: scale(1.1); z-index: 2; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .day-cell.empty { cursor: default; }
  .day-cell.today { border-color: var(--accent) !important; }

  .day-cell.travel-out  { background: var(--travel-out-bg); color: var(--travel-out); font-weight: 700; }
  .day-cell.work        { background: var(--work-bg); color: var(--work); }
  .day-cell.travel-home { background: var(--travel-home-bg); color: var(--travel-home); font-weight: 700; }
  .day-cell.off         { background: transparent; color: var(--muted); }
  .day-cell.weekend     { color: #5b6380; }

  .day-icon { font-size: 0.6rem; line-height: 1; }

  /* ── TIMESHEET TABLE ── */
  .timesheet-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; margin-bottom: 28px;
  }
  .ts-header {
    background: var(--surface2); padding: 14px 20px;
    font-weight: 600; font-size: 0.95rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  table {
    width: 100%; border-collapse: collapse;
  }
  th {
    background: var(--surface2);
    padding: 10px 14px;
    font-size: 0.72rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .7px;
    color: var(--muted);
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 11px 14px;
    font-size: 0.82rem;
    border-bottom: 1px solid rgba(46,51,80,0.5);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(79,110,247,0.05); }
  .badge {
    display: inline-block;
    padding: 2px 10px; border-radius: 20px;
    font-size: 0.72rem; font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
  }
  .badge.green  { background: var(--work-bg); color: var(--work); }
  .badge.yellow { background: var(--travel-out-bg); color: var(--travel-out); }
  .badge.red    { background: var(--travel-home-bg); color: var(--travel-home); }
  .badge.blue   { background: rgba(79,110,247,.15); color: var(--accent); }

  /* ── CONTROLS ── */
  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px;
    align-items: center;
  }
  .btn {
    padding: 8px 18px; border-radius: 8px;
    font-size: 0.82rem; font-weight: 600;
    cursor: pointer; transition: all .15s;
    border: 1px solid var(--border);
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #3d5be0; }
  .btn-ghost { background: var(--surface2); color: var(--text); }
  .btn-ghost:hover { background: var(--border); }

  label { font-size: 0.82rem; color: var(--muted); }
  input[type="date"] {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 7px 12px; border-radius: 8px;
    font-size: 0.82rem; font-family: 'JetBrains Mono', monospace;
  }

  /* ── TOOLTIP ── */
  .tooltip {
    position: fixed;
    background: #fff; color: #111;
    border-radius: 10px; padding: 10px 14px;
    font-size: 0.8rem; box-shadow: 0 8px 30px rgba(0,0,0,.5);
    pointer-events: none; z-index: 999;
    max-width: 220px;
    display: none;
  }
  .tooltip .tt-date { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; }
  .tooltip .tt-type { font-weight: 600; margin-bottom: 2px; }
  .tooltip .tt-detail { color: #555; font-size: 0.76rem; }

  /* ── SECTION TITLE ── */
  .section-title {
    font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin-bottom: 12px;
  }

  @media (max-width: 600px) {
    .year-grid { grid-template-columns: 1fr; }
    .stats { gap: 10px; }
    .stat-card { min-width: 100px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🔄</div>
    <div>
      <h1>Rotation <span>Schedule</span></h1>
      <div style="font-size:.72rem;color:var(--muted);margin-top:1px">15 Work · 2 Travel · Offshore Rotation</div>
    </div>
  </div>
  <div class="year-nav">
    <button id="prevYear">‹</button>
    <span class="year-label" id="yearLabel">2026</span>
    <button id="nextYear">›</button>
  </div>
</header>

<!-- Controls -->
<div class="controls">
  <label>First departure (Wed):</label>
  <input type="date" id="startDate" value="2026-04-01">
  <button class="btn btn-primary" onclick="rebuild()">Apply</button>
  <button class="btn btn-ghost" onclick="resetToDefault()">Reset 2026</button>
</div>

<!-- Stats -->
<div class="stats" id="statsBar"></div>

<!-- Year grid -->
<div class="year-grid" id="yearGrid"></div>

<!-- Timesheet -->
<div class="section-title">📋 Rotation Timesheet — All Trips</div>
<div class="timesheet-section">
  <div class="ts-header">
    <span>Trip Log &amp; Timesheet</span>
    <span id="tripCount" style="font-family:'JetBrains Mono',monospace;font-size:.85rem;color:var(--accent)"></span>
  </div>
  <div style="overflow-x:auto">
    <table id="timesheetTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Depart (Wed)</th>
          <th>Work Start (Thu)</th>
          <th>Work End (Thu)</th>
          <th>Fly Home (Thu)</th>
          <th>Work Days</th>
          <th>Travel Days</th>
          <th>Total Days</th>
        </tr>
      </thead>
      <tbody id="timesheetBody"></tbody>
    </table>
  </div>
</div>

<!-- Tooltip -->
<div class="tooltip" id="tooltip">
  <div class="tt-date" id="ttDate"></div>
  <div class="tt-type" id="ttType"></div>
  <div class="tt-detail" id="ttDetail"></div>
</div>

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// State
let currentYear = 2026;
let scheduleData = {}; // "YYYY-MM-DD" -> {type, tripIndex, label}
let trips = [];

function dateKey(d) {
  return d.toISOString().slice(0,10);
}

function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

function formatDate(d) {
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

function buildSchedule(startDateStr) {
  scheduleData = {};
  trips = [];

  // Find the first Wednesday on or after startDate
  let cur = new Date(startDateStr + 'T00:00:00');
  // Ensure Wednesday (3)
  while (cur.getDay() !== 3) cur = addDays(cur, 1);

  // Generate trips for 3 years from start
  const endDate = new Date(cur);
  endDate.setFullYear(endDate.getFullYear() + 3);

  let tripIdx = 1;
  while (cur < endDate) {
    const departWed = new Date(cur);       // Travel OUT - Wednesday
    const workStart = addDays(cur, 1);    // Work day 1 - Thursday
    const workEnd   = addDays(cur, 15);   // Work day 15 - Thursday (15 days Thu→Thu)
    const flyHome   = new Date(workEnd);  // Same day as last work day = fly home Thursday

    trips.push({
      index: tripIdx,
      departWed, workStart, workEnd, flyHome
    });

    // Mark days in schedule
    scheduleData[dateKey(departWed)] = { type: 'travel-out', tripIndex: tripIdx, label: '✈ Depart' };

    for (let d = new Date(workStart); d <= workEnd; d = addDays(d, 1)) {
      const k = dateKey(d);
      if (+d === +workEnd) {
        scheduleData[k] = { type: 'travel-home', tripIndex: tripIdx, label: '✈ Fly Home' };
      } else {
        scheduleData[k] = { type: 'work', tripIndex: tripIdx, label: `Work Day` };
      }
    }

    // Next rotation: skip 2 weeks off (17 on, variable off)
    // Pattern from image: roughly 2 weeks off after each rotation
    // Next departure = fly home + 14 days (to next Wednesday cycle)
    let next = addDays(flyHome, 1);
    while (next.getDay() !== 3) next = addDays(next, 1);
    // But must be at least 13 days after fly home
    while ((next - flyHome) / 86400000 < 13) next = addDays(next, 7);

    cur = next;
    tripIdx++;
  }
}

function getWorkDayNumber(dateStr, tripIdx) {
  const trip = trips[tripIdx - 1];
  if (!trip) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const diff = Math.round((d - trip.workStart) / 86400000) + 1;
  return diff;
}

function buildYearGrid() {
  const grid = document.getElementById('yearGrid');
  grid.innerHTML = '';
  const today = dateKey(new Date());

  for (let m = 0; m < 12; m++) {
    const card = document.createElement('div');
    card.className = 'month-card';

    // Count days per type for this month
    let wCount = 0, tOutCount = 0, tHomeCount = 0;
    const firstDay = new Date(currentYear, m, 1);
    const lastDay = new Date(currentYear, m+1, 0);
    for (let d = new Date(firstDay); d <= lastDay; d = addDays(d,1)) {
      const k = dateKey(d);
      const info = scheduleData[k];
      if (!info) continue;
      if (info.type === 'work') wCount++;
      else if (info.type === 'travel-out') tOutCount++;
      else if (info.type === 'travel-home') tHomeCount++;
    }

    const pillsHTML = [
      tOutCount ? `<span class="ms-pill ms-yellow">✈${tOutCount}</span>` : '',
      wCount ? `<span class="ms-pill ms-green">⚒${wCount}</span>` : '',
      tHomeCount ? `<span class="ms-pill ms-red">🏠${tHomeCount}</span>` : ''
    ].join('');

    card.innerHTML = `
      <div class="month-header">
        <span>${MONTHS[m]} ${currentYear}</span>
        <div class="month-summary">${pillsHTML}</div>
      </div>
      <div class="month-body">
        <div class="dow-row">
          ${DAYS.map((d,i)=>`<div class="dow-cell ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('')}
        </div>
        <div class="days-grid" id="days-${m}"></div>
      </div>
    `;
    grid.appendChild(card);

    const daysGrid = card.querySelector(`#days-${m}`);

    // Blank cells before first day
    const startDow = new Date(currentYear, m, 1).getDay();
    for (let i = 0; i < startDow; i++) {
      const blank = document.createElement('div');
      blank.className = 'day-cell empty';
      daysGrid.appendChild(blank);
    }

    const daysInMonth = new Date(currentYear, m+1, 0).getDate();
    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(currentYear, m, day);
      const k = dateKey(d);
      const info = scheduleData[k];
      const dow = d.getDay();

      const cell = document.createElement('div');
      let cls = 'day-cell';
      let icon = '';
      let ttType = 'Day Off';
      let ttDetail = '';

      if (info) {
        cls += ' ' + info.type;
        if (info.type === 'travel-out') {
          icon = '✈';
          ttType = `✈ Travel Out — Trip #${info.tripIndex}`;
          ttDetail = 'Departure day. Fly to worksite.';
        } else if (info.type === 'work') {
          const wn = getWorkDayNumber(k, info.tripIndex);
          icon = wn <= 9 ? `${wn}` : '';
          ttType = `⚒ Work Day ${wn} — Trip #${info.tripIndex}`;
          ttDetail = '15-day rotation shift.';
        } else if (info.type === 'travel-home') {
          icon = '🏠';
          ttType = `🏠 Fly Home — Trip #${info.tripIndex}`;
          ttDetail = 'Last work day + flight home.';
        }
      } else {
        if (dow === 0 || dow === 6) cls += ' weekend';
        else cls += ' off';
        ttDetail = 'Rest / time off.';
      }

      if (k === today) cls += ' today';

      cell.className = cls;
      cell.innerHTML = `<span>${day}</span>${icon ? `<span class="day-icon">${icon}</span>` : ''}`;

      // Tooltip
      cell.addEventListener('mouseenter', (e) => {
        const tt = document.getElementById('tooltip');
        document.getElementById('ttDate').textContent = formatDate(d);
        document.getElementById('ttType').textContent = ttType;
        document.getElementById('ttDetail').textContent = ttDetail;
        tt.style.display = 'block';
        posTooltip(e);
      });
      cell.addEventListener('mousemove', posTooltip);
      cell.addEventListener('mouseleave', () => {
        document.getElementById('tooltip').style.display = 'none';
      });

      daysGrid.appendChild(cell);
    }
  }
}

function posTooltip(e) {
  const tt = document.getElementById('tooltip');
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + 230 > window.innerWidth) x = e.clientX - 230;
  if (y + 100 > window.innerHeight) y = e.clientY - 100;
  tt.style.left = x + 'px';
  tt.style.top  = y + 'px';
}

function buildStats() {
  const bar = document.getElementById('statsBar');
  let workY = 0, tOutY = 0, tHomeY = 0, tripsY = 0;
  const tripsInYear = new Set();

  Object.entries(scheduleData).forEach(([k, v]) => {
    if (!k.startsWith(currentYear)) return;
    if (v.type === 'work') { workY++; tripsInYear.add(v.tripIndex); }
    if (v.type === 'travel-out') tOutY++;
    if (v.type === 'travel-home') tHomeY++;
  });
  tripsY = tripsInYear.size;

  bar.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Work Days ${currentYear}</div>
      <div class="stat-value green">${workY}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Travel Days</div>
      <div class="stat-value yellow">${tOutY + tHomeY}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Trips (Rotations)</div>
      <div class="stat-value blue">${tripsY}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Billable Days</div>
      <div class="stat-value blue">${workY + tOutY + tHomeY}</div>
    </div>
  `;
}

function buildTimesheet() {
  const tbody = document.getElementById('timesheetBody');
  document.getElementById('tripCount').textContent = `${trips.length} trips`;
  tbody.innerHTML = trips.map(t => {
    const workDays = 15;
    const travelDays = 2;
    return `<tr>
      <td><span class="badge blue">#${t.index}</span></td>
      <td><span class="badge yellow">✈ ${formatDate(t.departWed)}</span></td>
      <td>${formatDate(t.workStart)}</td>
      <td>${formatDate(addDays(t.workEnd,-1))}</td>
      <td><span class="badge red">🏠 ${formatDate(t.flyHome)}</span></td>
      <td><span class="badge green">${workDays} days</span></td>
      <td><span class="badge yellow">${travelDays} days</span></td>
      <td><strong>${workDays + travelDays}</strong></td>
    </tr>`;
  }).join('');
}

function rebuild() {
  const val = document.getElementById('startDate').value;
  if (!val) return;
  buildSchedule(val);
  buildStats();
  buildYearGrid();
  buildTimesheet();
}

function resetToDefault() {
  document.getElementById('startDate').value = '2026-04-01';
  rebuild();
}

document.getElementById('prevYear').addEventListener('click', () => {
  currentYear--;
  document.getElementById('yearLabel').textContent = currentYear;
  buildStats();
  buildYearGrid();
});
document.getElementById('nextYear').addEventListener('click', () => {
  currentYear++;
  document.getElementById('yearLabel').textContent = currentYear;
  buildStats();
  buildYearGrid();
});

// Init
rebuild();
</script>
</body>
</html>
